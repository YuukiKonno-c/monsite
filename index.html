<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D.P.C — DOSSIER CONFIDENTIEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --green: #00ff41;
      --green-dim: #00c832;
      --green-dark: #003b0f;
      --green-glow: rgba(0,255,65,0.15);
      --red: #ff2222;
      --red-dim: #cc0000;
      --amber: #ffb000;
      --bg: #020a02;
      --bg2: #050f05;
      --border: rgba(0,255,65,0.25);
      --text: #b0ffb8;
      --mono: 'Share Tech Mono', monospace;
      --display: 'Orbitron', sans-serif;
      --vt: 'VT323', monospace;
    }
 
    * { margin: 0; padding: 0; box-sizing: border-box; }
 
    html { scroll-behavior: smooth; }
 
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow-x: hidden;
      cursor: crosshair;
    }
 
    /* SCANLINE OVERLAY */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }
 
    /* NOISE TEXTURE */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9998;
      opacity: 0.6;
    }
 
    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 40px;
      background: rgba(2,10,2,0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
 
    .nav-logo {
      font-family: var(--display);
      font-size: 13px;
      font-weight: 900;
      color: var(--green);
      letter-spacing: 4px;
      text-shadow: 0 0 10px var(--green);
    }
 
    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }
 
    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 2px;
      transition: color 0.2s;
    }
 
    .nav-links a:hover { color: var(--green); text-shadow: 0 0 8px var(--green); }
 
    .nav-status {
      font-size: 10px;
      color: var(--red);
      animation: blink 1s step-end infinite;
    }
 
    /* SECTIONS */
    section {
      min-height: 100vh;
      padding: 120px 60px 80px;
      position: relative;
    }
 
    /* SECTION 1 — VISION */
    #vision {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: radial-gradient(ellipse at center, rgba(0,50,10,0.4) 0%, var(--bg) 70%);
    }
 
    .glitch-title {
      font-family: var(--display);
      font-size: clamp(48px, 10vw, 100px);
      font-weight: 900;
      color: var(--green);
      text-shadow: 0 0 30px var(--green), 0 0 60px rgba(0,255,65,0.3);
      letter-spacing: 12px;
      position: relative;
      animation: glitch 4s infinite;
    }
 
    .glitch-title::before,
    .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      font-family: var(--display);
      font-size: inherit;
      letter-spacing: inherit;
    }
 
    .glitch-title::before {
      color: var(--red);
      animation: glitch-1 4s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
    }
 
    .glitch-title::after {
      color: #00f3ff;
      animation: glitch-2 4s infinite;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
    }
 
    .tagline {
      font-family: var(--vt);
      font-size: 22px;
      color: var(--green-dim);
      letter-spacing: 4px;
      margin: 20px 0;
      opacity: 0.8;
    }
 
    .vision-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 50px 0;
      max-width: 900px;
      width: 100%;
    }
 
    .stat-box {
      border: 1px solid var(--border);
      padding: 20px;
      text-align: center;
      position: relative;
      background: var(--green-glow);
      transition: all 0.3s;
    }
 
    .stat-box:hover {
      border-color: var(--green);
      box-shadow: 0 0 20px var(--green-glow), inset 0 0 20px var(--green-glow);
    }
 
    .stat-box::before {
      content: '';
      position: absolute;
      top: -1px; left: 10px;
      width: 30px; height: 2px;
      background: var(--bg);
    }
 
    .stat-label {
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--green-dim);
      margin-bottom: 8px;
    }
 
    .stat-value {
      font-family: var(--display);
      font-size: 20px;
      font-weight: 700;
      color: var(--green);
      text-shadow: 0 0 10px var(--green);
    }
 
    .description-box {
      max-width: 700px;
      border: 1px solid var(--border);
      padding: 30px 40px;
      background: rgba(0,20,5,0.6);
      text-align: left;
      font-size: 14px;
      line-height: 1.9;
      position: relative;
    }
 
    .description-box::before {
      content: '> RAPPORT_CONFIDENTIEL.txt';
      display: block;
      font-size: 10px;
      color: var(--green-dim);
      letter-spacing: 2px;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
 
    .status-badge {
      display: inline-block;
      background: var(--red);
      color: #000;
      font-family: var(--display);
      font-size: 9px;
      font-weight: 700;
      padding: 4px 12px;
      letter-spacing: 3px;
      margin-top: 20px;
      animation: pulse-red 2s ease-in-out infinite;
    }
 
    /* SECTION 2 — SUSPECTS */
    #suspects {
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }
 
    .section-header {
      font-family: var(--display);
      font-size: 11px;
      letter-spacing: 6px;
      color: var(--green-dim);
      margin-bottom: 10px;
    }
 
    .section-title {
      font-family: var(--display);
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 900;
      color: var(--green);
      text-shadow: 0 0 20px rgba(0,255,65,0.4);
      letter-spacing: 6px;
      margin-bottom: 60px;
    }
 
    .suspects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      max-width: 1100px;
    }
 
    .suspect-card {
      border: 1px solid var(--border);
      background: rgba(0,15,5,0.8);
      position: relative;
      overflow: hidden;
      transition: all 0.4s;
    }
 
    .suspect-card:hover {
      border-color: var(--green);
      box-shadow: 0 0 30px rgba(0,255,65,0.1), inset 0 0 30px rgba(0,255,65,0.03);
      transform: translateY(-4px);
    }
 
    .suspect-card::before {
      content: 'AVIS DE RECHERCHE';
      position: absolute;
      top: 15px; left: 0; right: 0;
      text-align: center;
      font-family: var(--display);
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--red);
      z-index: 2;
    }
 
    .suspect-img-container {
      width: 100%;
      height: 260px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
 
    .suspect-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(80%) contrast(1.2) brightness(0.8);
      transition: filter 0.4s;
    }
 
    .suspect-card:hover .suspect-img-container img {
      filter: grayscale(40%) contrast(1.3) brightness(0.9);
    }
 
    .img-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--green-dim);
      opacity: 0.5;
    }
 
    .img-placeholder svg { width: 60px; height: 60px; }
    .img-placeholder span { font-size: 10px; letter-spacing: 2px; }
 
    .scan-line {
      position: absolute;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      animation: scan 3s linear infinite;
      opacity: 0.6;
    }
 
    .suspect-body {
      padding: 20px 24px 24px;
    }
 
    .suspect-nom {
      font-family: var(--display);
      font-size: 18px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
 
    .suspect-alias {
      font-size: 10px;
      color: var(--amber);
      letter-spacing: 2px;
      margin-bottom: 14px;
    }
 
    .suspect-desc {
      font-size: 12px;
      line-height: 1.7;
      color: rgba(176,255,184,0.7);
      margin-bottom: 16px;
      border-left: 2px solid var(--border);
      padding-left: 12px;
    }
 
    .suspect-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
 
    .prime {
      font-family: var(--display);
      font-size: 14px;
      font-weight: 700;
      color: var(--amber);
      text-shadow: 0 0 8px rgba(255,176,0,0.5);
    }
 
    .prime-label {
      font-size: 8px;
      letter-spacing: 2px;
      color: rgba(176,255,184,0.4);
      display: block;
    }
 
    .danger-tag {
      font-size: 9px;
      letter-spacing: 2px;
      padding: 4px 10px;
      border: 1px solid var(--red);
      color: var(--red);
      font-family: var(--display);
    }
 
    .danger-tag.extreme { animation: pulse-red 1.5s ease-in-out infinite; }
 
    /* SECTION 3 — AVIS */
    #temoignages {
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
 
    .avis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      max-width: 1100px;
    }
 
    .avis-card {
      border: 1px solid var(--border);
      padding: 24px;
      background: rgba(0,20,5,0.5);
      position: relative;
      transition: all 0.3s;
    }
 
    .avis-card:hover {
      border-color: rgba(0,255,65,0.4);
      background: rgba(0,20,5,0.8);
    }
 
    .avis-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
 
    .avis-auteur {
      font-family: var(--display);
      font-size: 12px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 1px;
    }
 
    .avis-date {
      font-size: 9px;
      color: rgba(176,255,184,0.4);
      letter-spacing: 1px;
      margin-top: 3px;
    }
 
    .fiabilite {
      font-size: 8px;
      letter-spacing: 2px;
      padding: 3px 8px;
      font-family: var(--display);
    }
 
    .fiabilite.confirme { border: 1px solid var(--green); color: var(--green); }
    .fiabilite.non-verifie { border: 1px solid var(--amber); color: var(--amber); }
    .fiabilite.en-cours { border: 1px solid #00ccff; color: #00ccff; }
 
    .avis-texte {
      font-size: 13px;
      line-height: 1.8;
      color: rgba(176,255,184,0.75);
    }
 
    .avis-texte::before { content: '> '; color: var(--green-dim); }
 
    /* FOOTER */
    footer {
      padding: 30px 60px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: rgba(176,255,184,0.3);
      letter-spacing: 2px;
    }
 
    /* TERMINAL CURSOR */
    .cursor::after {
      content: '█';
      animation: blink 1s step-end infinite;
      color: var(--green);
    }
 
    /* ANIMATIONS */
    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      91% { transform: translate(-2px, 1px); }
      92% { transform: translate(2px, -1px); }
      93% { transform: translate(-1px, 2px); }
      94% { transform: translate(1px, -2px); }
      95% { transform: translate(0); }
    }
 
    @keyframes glitch-1 {
      0%, 90%, 100% { transform: translate(0); opacity: 0; }
      91% { transform: translate(-4px, 0); opacity: 0.8; }
      93% { transform: translate(4px, 0); opacity: 0.8; }
      95% { opacity: 0; }
    }
 
    @keyframes glitch-2 {
      0%, 90%, 100% { transform: translate(0); opacity: 0; }
      92% { transform: translate(4px, 0); opacity: 0.6; }
      94% { transform: translate(-4px, 0); opacity: 0.6; }
      95% { opacity: 0; }
    }
 
    @keyframes scan {
      0% { top: -3px; }
      100% { top: 100%; }
    }
 
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
 
    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
 
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
 
    /* SCROLL REVEAL */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease;
    }
 
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
 
    /* TYPING EFFECT */
    .typing {
      overflow: hidden;
      white-space: nowrap;
      animation: typing 2s steps(40) forwards;
    }
 
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
 
    /* CORNER DECORATIONS */
    .corner-tl, .corner-br {
      position: absolute;
      width: 20px;
      height: 20px;
    }
 
    .corner-tl {
      top: 0; left: 0;
      border-top: 2px solid var(--green);
      border-left: 2px solid var(--green);
    }
 
    .corner-br {
      bottom: 0; right: 0;
      border-bottom: 2px solid var(--green);
      border-right: 2px solid var(--green);
    }
 
    /* SCROLL INDICATOR */
    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--green-dim);
      animation: bounce 2s ease-in-out infinite;
    }
 
    .scroll-indicator::after {
      content: '▼';
      font-size: 14px;
    }
 
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(8px); }
    }
    h1 {
  font-size: 48px;
  text-align: center;
}

.subtitle {
  font-size: 18px;
  text-align: center;
  color: #00ff41;
  font-family: Arial, sans-serif;
}
  </style>
</head>
<body>
 
  <!-- NAV -->
  <nav>
    <div class="nav-logo">D.P.C</div>
    <ul class="nav-links">
      <li><a href="#vision">DOSSIER</a></li>
      <li><a href="#suspects">SUSPECTS</a></li>
      <li><a href="#temoignages">TÉMOIGNAGES</a></li>
    </ul>
    <div class="nav-status">● LIVE — CRYPTÉ</div>
  </nav>
 
  <!-- SECTION 1 : VISION -->
  <section id="vision">
    <h1 class="glitch-title" data-text="D.P.C" id="main-title">⛃ D.P.C ⛃</h1>
    <p class="tagline" id="tagline">
  ☢ Département des Pokémons Corrompus ☢
    </p>
 
    <div class="vision-grid">
      <div class="stat-box reveal">
        <div class="stat-label">STATUT</div>
        <div class="stat-value" id="stat-statut" style="color:var(--red)">—</div>
      </div>
      <div class="stat-box reveal">
        <div class="stat-label">NIVEAU MENACE</div>
        <div class="stat-value" id="stat-menace">—</div>
      </div>
      <div class="stat-box reveal">
        <div class="stat-label">DATE CRÉATION</div>
        <div class="stat-value" id="stat-date">—</div>
      </div>
    </div>
 
    <div class="description-box reveal">
      <p id="vision-desc"></p>
      <span class="status-badge" id="vision-badge">—</span>
    </div>
 
    <div class="scroll-indicator">DÉFILER</div>
  </section>
 
  <!-- SECTION 2 : SUSPECTS -->
  <section id="suspects">
    <div class="section-header">// DOSSIER_02 —</div>
    <h2 class="section-title">AVIS DE RECHERCHE</h2>
    <div class="suspects-grid" id="suspects-grid"></div>
  </section>
 
  <!-- SECTION 3 : TÉMOIGNAGES -->
  <section id="temoignages">
    <div class="section-header">// DOSSIER_03 —</div>
    <h2 class="section-title">TÉMOIGNAGES</h2>
    <div class="avis-grid" id="avis-grid"></div>
  </section>
 
  <!-- FOOTER -->
  <footer>
    <span>D.P.C — DOSSIER CONFIDENTIEL</span>
    <span id="footer-date"></span>
    <span>ACCÈS RESTREINT — NIVEAU ALPHA</span>
  </footer>
 
  <script>
    // ── LOAD CONTENT ──────────────────────────────────────────────
    async function loadContent() {
      const res = await fetch('/data/content.json');
      const data = await res.json();
 
      // Section 1
      const e = data.entreprise;
      typeText('tagline', e.tagline, 60);
      setTimeout(() => {
        document.getElementById('stat-statut').textContent = e.statut;
        document.getElementById('stat-menace').textContent = e.niveau_menace;
        document.getElementById('stat-date').textContent = e.date_creation;
        document.getElementById('vision-desc').textContent = e.description;
        document.getElementById('vision-badge').textContent = '⚠ ' + e.statut;
      }, 800);
 
      // Section 2 — Suspects
      const grid = document.getElementById('suspects-grid');
      data.suspects.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'suspect-card reveal';
        card.style.animationDelay = `${i * 0.15}s`;
 
        const imgContent = s.image
          ? `<img src="/images/${s.image}" alt="${s.nom}" onerror="this.parentElement.innerHTML=placeholderSVG()">`
          : placeholderHTML();
 
        card.innerHTML = `
          <div class="suspect-img-container">
            ${s.image
              ? `<img src="/images/${s.image}" alt="${s.nom}" onerror="this.outerHTML=\`${placeholderHTML()}\`">`
              : placeholderHTML()}
            <div class="scan-line"></div>
          </div>
          <div class="suspect-body">
            <div class="suspect-nom">${s.nom}</div>
            <div class="suspect-alias">IDENTITÉ RÉELLE : ${s.vrai_nom}</div>
            <div class="suspect-desc">${s.description}</div>
            <div class="suspect-meta">
              <div>
                <span class="prime-label">PRIME</span>
                <span class="prime">${s.prime}</span>
              </div>
              <span class="danger-tag ${s.danger === 'EXTRÊME' ? 'extreme' : ''}">${s.danger}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
 
      // Section 3 — Avis
      const avisGrid = document.getElementById('avis-grid');
      data.avis.forEach((a, i) => {
        const fiabClass = a.fiabilite === 'CONFIRMÉ' ? 'confirme'
                        : a.fiabilite === 'EN COURS' ? 'en-cours'
                        : 'non-verifie';
        const card = document.createElement('div');
        card.className = 'avis-card reveal';
        card.innerHTML = `
          <div class="avis-header">
            <div>
              <div class="avis-auteur">${a.auteur}</div>
              <div class="avis-date">${a.date}</div>
            </div>
            <span class="fiabilite ${fiabClass}">${a.fiabilite}</span>
          </div>
          <div class="avis-texte">${a.texte}</div>
        `;
        avisGrid.appendChild(card);
      });
 
      // Footer date
      document.getElementById('footer-date').textContent =
        new Date().toISOString().split('T')[0].replace(/-/g, '.');
    }
 
    function placeholderHTML() {
      return `<div class="img-placeholder">
        <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="8" width="40" height="44" rx="2" stroke="#00ff41" stroke-width="1.5" stroke-dasharray="4 2"/>
          <circle cx="30" cy="24" r="8" stroke="#00ff41" stroke-width="1.5"/>
          <path d="M14 50c0-8.837 7.163-16 16-16s16 7.163 16 16" stroke="#00ff41" stroke-width="1.5"/>
          <line x1="5" y1="5" x2="55" y2="55" stroke="#ff2222" stroke-width="1" opacity="0.6"/>
        </svg>
        <span>IMAGE CLASSIFIÉE</span>
      </div>`;
    }
 
    // ── TYPING EFFECT ─────────────────────────────────────────────
    function typeText(id, text, speed = 50) {
      const el = document.getElementById(id);
      el.textContent = '';
      let i = 0;
      const interval = setInterval(() => {
        el.textContent += text[i];
        i++;
        if (i >= text.length) clearInterval(interval);
      }, speed);
    }
 
    // ── SCROLL REVEAL ─────────────────────────────────────────────
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.15 });
 
    function observeAll() {
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }
 
    // ── GLITCH RANDOM ─────────────────────────────────────────────
    function randomGlitch() {
      const title = document.getElementById('main-title');
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%';
      const original = 'Faille de sécurité Prototype instable en liberté';
      let count = 0;
      const interval = setInterval(() => {
        title.textContent = original.split('').map((c, i) =>
          c === ' ' ? ' ' : (Math.random() > 0.7 ? chars[Math.floor(Math.random() * chars.length)] : c)
        ).join('');
        count++;
        if (count > 8) { title.textContent = original; clearInterval(interval); }
      }, 60);
    }
 
    setInterval(randomGlitch, 6000);
 
    // ── INIT ──────────────────────────────────────────────────────
    loadContent().then(() => {
      setTimeout(observeAll, 100);
    });
  </script>
</body>
</html>
